<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<link rel="icon" type="image/svg+xml" href="/favicon.svg">
	<meta content="yes" name="mobile-web-app-capable">
	<meta content="yes" name="apple-mobile-web-app-capable">
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<meta name="viewport"
		content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
	<title>Homelab Panel</title>
<script>
	// 首屏背景跟随已存储的颜色模式（key 与 main.tsx 的 modeStorageKey 一致），
	// 避免 loading 屏与最终 MUI 模式不一致的闪烁。
	(function () {
		try {
			var mode = localStorage.getItem('homelab-color-mode') || 'system';
			var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
			if (mode === 'dark' || (mode === 'system' && prefersDark)) {
				document.documentElement.style.backgroundColor = '#121212';
			}
		} catch (e) {}
	})();
</script>
</head>

<body>
	<div id="root">
		<style>
			.loading-wrap {
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				height: 100vh;
				gap: 20px;
				color: #1976d2;
			}

			.material-loader {
				position: relative;
				width: 64px;
				height: 64px;
			}

			.material-loader::before {
				position: absolute;
				inset: 2px;
				border: 1px solid currentColor;
				border-radius: 50%;
				content: "";
				opacity: 0.12;
			}

			.material-loader__svg {
				display: block;
				width: 100%;
				height: 100%;
				animation: material-loader-rotate 1.4s linear infinite;
			}

			.material-loader__circle {
				fill: none;
				stroke: currentColor;
				stroke-width: 4;
				stroke-linecap: round;
				stroke-dasharray: 90, 150;
				stroke-dashoffset: 0;
				transform-origin: center;
				animation:
					material-loader-dash 1.4s ease-in-out infinite,
					material-loader-color 5.6s ease-in-out infinite;
			}

			.loading-text {
				margin: 0;
				color: rgba(0, 0, 0, 0.62);
				font-size: 0.875rem;
				font-weight: 500;
				letter-spacing: 0.08em;
				line-height: 1.43;
				text-transform: uppercase;
			}

			@media (prefers-color-scheme: dark) {
				.loading-wrap {
					color: #90caf9;
				}

				.loading-text {
					color: rgba(255, 255, 255, 0.7);
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.material-loader__svg,
				.material-loader__circle {
					animation-duration: 2.4s;
				}
			}

			@keyframes material-loader-rotate {
				100% {
					transform: rotate(360deg);
				}
			}

			@keyframes material-loader-dash {
				0% {
					stroke-dasharray: 1, 150;
					stroke-dashoffset: 0;
				}

				50% {
					stroke-dasharray: 90, 150;
					stroke-dashoffset: -35;
				}

				100% {
					stroke-dasharray: 90, 150;
					stroke-dashoffset: -124;
				}
			}

			@keyframes material-loader-color {
				0%,
				100% {
					stroke: #1976d2;
				}

				25% {
					stroke: #009688;
				}

				50% {
					stroke: #4caf50;
				}

				75% {
					stroke: #ff9800;
				}
			}

		</style>
		<div class="loading-wrap">
			<div class="material-loader" role="status" aria-label="正在加载">
				<svg class="material-loader__svg" viewBox="0 0 50 50" aria-hidden="true">
					<circle class="material-loader__circle" cx="25" cy="25" r="20"></circle>
				</svg>
			</div>
			<p class="loading-text">Loading</p>
		</div>
	</div>
	<script type="module" src="/src/main.tsx"></script>
</body>

</html>
