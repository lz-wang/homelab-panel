name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (for example v1.0.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi

          if ! printf '%s' "${VERSION}" | grep -Eq '^v[0-9A-Za-z][0-9A-Za-z._-]*$'; then
            echo "Invalid release version: ${VERSION}" >&2
            exit 1
          fi

          if ! git rev-parse --verify --quiet "refs/tags/${VERSION}^{}" >/dev/null; then
            echo "Release tag does not exist: ${VERSION}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate Homebrew publishing credential
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN is required to publish Formula/homelab-panel.rb." >&2
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.version }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --prefer-offline --no-audit

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Run release checks
        run: |
          make check
          make test

  create-release:
    runs-on: ubuntu-latest
    needs: [prepare, verify]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.version }}
          fetch-depth: 0

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists; assets will be updated."
            exit 0
          fi

          gh release create "${VERSION}" \
            --draft \
            --generate-notes \
            --verify-tag \
            --title "${VERSION}"

  build:
    runs-on: ubuntu-latest
    needs: [prepare, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            suffix: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            suffix: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            suffix: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            suffix: ".exe"
            archive: zip
          - goos: windows
            goarch: arm64
            suffix: ".exe"
            archive: zip

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.version }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci --prefer-offline --no-audit
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Build release binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          output="homelab-panel-${VERSION}-${GOOS}-${GOARCH}${{ matrix.suffix }}"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "${output}" .
          sha256sum "${output}" > "${output}.sha256"

      - name: Package WebDAV archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          name="homelab-panel_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          package_dir="release/${name}"
          mkdir -p "${package_dir}"
          cp "homelab-panel-${version}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}" "${package_dir}/homelab-panel${{ matrix.suffix }}"
          if [[ "${{ matrix.archive }}" == 'zip' ]]; then
            archive="release/${name}.zip"
            (cd "${package_dir}" && zip -qr "${GITHUB_WORKSPACE}/${archive}" .)
          else
            archive="release/${name}.tar.gz"
            tar -C "${package_dir}" -czf "${archive}" .
          fi
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Upload release archive and checksum to WebDAV
        uses: bxb100/action-upload-webdav@v1
        with:
          webdav_address: ${{ secrets.WEBDAV_SERVER }}
          webdav_username: ${{ secrets.WEBDAV_USERNAME }}
          webdav_password: ${{ secrets.WEBDAV_PASSWORD }}
          webdav_upload_path: "/Shares/github/${{ github.repository }}/${{ needs.prepare.outputs.version }}"
          files: |
            release/homelab-panel_${{ needs.prepare.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}
            release/homelab-panel_${{ needs.prepare.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}.sha256

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          asset="homelab-panel-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          archive="release/homelab-panel_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}"
          gh release upload "${VERSION}" "${asset}" "${asset}.sha256" "${archive}" "${archive}.sha256" --clobber

  publish:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "${VERSION}" --draft=false --repo "${GITHUB_REPOSITORY}"

  homebrew:
    name: Publish Homebrew Formula
    runs-on: macos-latest
    needs: [prepare, publish]
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    steps:
      - name: Check latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ "${latest}" != "${TAG}" ]]; then
            echo "Skip stale release: ${TAG}; latest is ${latest}."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "publish=true" >> "${GITHUB_OUTPUT}"

      - name: Checkout Homebrew tap
        if: steps.release.outputs.publish == 'true'
        uses: actions/checkout@v6
        with:
          repository: lz-wang/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Read release archive checksums
        if: steps.release.outputs.publish == 'true'
        id: sha
        env:
          TAG: ${{ needs.prepare.outputs.version }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          base="https://github.com/lz-wang/homelab-panel/releases/download/${TAG}"
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            file="homelab-panel_${VERSION}_${target}.tar.gz.sha256"
            sha="$(curl -fsSL "${base}/${file}" | awk 'NR == 1 { print $1 }')"

            if [[ ! "${sha}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid SHA-256 for ${file}." >&2
              exit 1
            fi

            echo "${target}=${sha}" >> "${GITHUB_OUTPUT}"
          done

      - name: Generate Formula
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DARWIN_AMD64_SHA: ${{ steps.sha.outputs.darwin_amd64 }}
          DARWIN_ARM64_SHA: ${{ steps.sha.outputs.darwin_arm64 }}
          LINUX_AMD64_SHA: ${{ steps.sha.outputs.linux_amd64 }}
          LINUX_ARM64_SHA: ${{ steps.sha.outputs.linux_arm64 }}
        shell: bash
        run: |
          set -euo pipefail

          cat > homebrew-tap/Formula/homelab-panel.rb <<RUBY
          class HomelabPanel < Formula
            desc "Lightweight dashboard for personal homelabs"
            homepage "https://github.com/lz-wang/homelab-panel"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/lz-wang/homelab-panel/releases/download/${VERSION}/homelab-panel_${VERSION}_darwin_arm64.tar.gz"
                sha256 "${DARWIN_ARM64_SHA}"
              end

              on_intel do
                url "https://github.com/lz-wang/homelab-panel/releases/download/${VERSION}/homelab-panel_${VERSION}_darwin_amd64.tar.gz"
                sha256 "${DARWIN_AMD64_SHA}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/lz-wang/homelab-panel/releases/download/${VERSION}/homelab-panel_${VERSION}_linux_arm64.tar.gz"
                sha256 "${LINUX_ARM64_SHA}"
              end

              on_intel do
                url "https://github.com/lz-wang/homelab-panel/releases/download/${VERSION}/homelab-panel_${VERSION}_linux_amd64.tar.gz"
                sha256 "${LINUX_AMD64_SHA}"
              end
            end

            def install
              bin.install "homelab-panel"
            end

            test do
              assert_match "${VERSION}", shell_output("#{bin}/homelab-panel version")
            end
          end
          RUBY

      - name: Commit Formula locally
        if: steps.release.outputs.publish == 'true'
        id: formula
        shell: bash
        run: |
          set -euo pipefail

          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git -C homebrew-tap status --porcelain -- Formula/homelab-panel.rb)" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git -C homebrew-tap add Formula/homelab-panel.rb
          git -C homebrew-tap commit -m "homelab-panel ${{ needs.prepare.outputs.version }}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Test Formula
        if: steps.release.outputs.publish == 'true' && steps.formula.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          brew tap lz-wang/tap "file://${GITHUB_WORKSPACE}/homebrew-tap"
          brew audit --strict --formula lz-wang/tap/homelab-panel
          brew install --formula lz-wang/tap/homelab-panel
          brew test lz-wang/tap/homelab-panel

      - name: Publish Formula
        if: steps.release.outputs.publish == 'true' && steps.formula.outputs.changed == 'true'
        shell: bash
        run: git -C homebrew-tap push origin HEAD:main
